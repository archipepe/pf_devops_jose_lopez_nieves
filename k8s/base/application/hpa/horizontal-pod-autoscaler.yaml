apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: symfony-hpa
  namespace: symfony-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: symfony-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
