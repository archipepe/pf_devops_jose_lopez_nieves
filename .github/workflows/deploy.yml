name: AWS EKS Blue/Green Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Ejecutar tests"]
    types:
      - completed

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-1' }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME || 'pf-devops-eks' }}
  KUBERNETES_NAMESPACE: symfony-ns
  IMAGE_REPO: docker.io/${{ secrets.DOCKER_ACCOUNT }}/mysymfony-php-nginx
  IMAGE_TAG: 7.1-prod

jobs:
  pre-deployment:
    runs-on: ubuntu-24.04

    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      current_version: ${{ steps.current.outputs.version }}
      new_version: ${{ steps.new.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Get current deployment version
        id: current
        run: |
          CURRENT=$(kubectl get deployment symfony-deployment -n ${{ env.KUBERNETES_NAMESPACE }} \
            -o jsonpath='{.spec.template.spec.containers[0].image}' | awk -F':' '{print $2}')
          echo "version=${CURRENT}" >> $GITHUB_OUTPUT
          echo "Current version: ${CURRENT}"

      - name: Compute new version from image tag
        id: new
        run: |
          NEW="${{ env.IMAGE_TAG }}"
          echo "version=${NEW}" >> $GITHUB_OUTPUT
          echo "New version: ${NEW}"

  deploy-green:
    needs: pre-deployment
    runs-on: ubuntu-24.04

    if: success()

    outputs:
      pods_ready: ${{ steps.verify.outputs.ready_count }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Create GREEN deployment
        run: |
          kubectl get deployment symfony-deployment -n ${{ env.KUBERNETES_NAMESPACE }} -o yaml \
            | sed 's/name: symfony-deployment/name: symfony-deployment-green/' \
            | sed 's/version: .*/version: green/' \
            | sed 's/image: .*/image: '"${IMAGE_REPO}:${IMAGE_TAG}"'/' \
            > green.yaml

          kubectl apply -f green.yaml

      - name: Wait for GREEN pods
        id: verify
        run: |
          for i in {1..30}; do
            READY=$(kubectl get pods -n ${{ env.KUBERNETES_NAMESPACE }} -l version=green \
              -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}' | grep -c True || echo 0)

            TOTAL=$(kubectl get pods -n ${{ env.KUBERNETES_NAMESPACE }} -l version=green | tail -n +2 | wc -l)

            echo "$READY/$TOTAL ready"

            if [ "$READY" -eq "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              echo "ready_count=$READY" >> $GITHUB_OUTPUT
              exit 0
            fi

            sleep 5
          done

          exit 1

      - name: Health check
        run: |
          POD=$(kubectl get pods -n ${{ env.KUBERNETES_NAMESPACE }} -l version=green -o jsonpath='{.items[0].metadata.name}')
          STATUS=$(kubectl exec -n ${{ env.KUBERNETES_NAMESPACE }} "$POD" -- curl -s -o /dev/null -w "%{http_code}" http://localhost/health)
          test "$STATUS" = "200"

  switch-traffic:
    needs: deploy-green
    runs-on: ubuntu-24.04

    if: success()

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Switch service selector
        run: |
          kubectl patch service nginx-service -n ${{ env.KUBERNETES_NAMESPACE }} \
            --type=json \
            -p='[{"op":"replace","path":"/spec/selector/version","value":"green"}]'

  cleanup:
    needs: [deploy-green, switch-traffic]
    runs-on: ubuntu-24.04

    if: success()

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Delete old BLUE deployment
        run: |
          kubectl delete deployment symfony-deployment -n ${{ env.KUBERNETES_NAMESPACE }} || true

  report:
    needs: [pre-deployment, deploy-green, switch-traffic, cleanup]
    runs-on: ubuntu-24.04

    if: success()

    steps:
      - name: Deployment summary
        run: |
          echo "### Blue/Green Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Previous version: ${{ needs.pre-deployment.outputs.current_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- New version: ${{ needs.pre-deployment.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ✅ Success" >> $GITHUB_STEP_SUMMARY
